<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HID Gadget Controller</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📱 HID Gadget Controller</h1>
            <div class="status" id="status">
                <span class="status-dot"></span>
                <span id="status-text">Connecting...</span>
            </div>
        </div>

        <!-- Media Controls (Top Bar) -->
        <div class="media-controls">
            <button class="media-btn" data-action="PREV">⏮</button>
            <button class="media-btn" data-action="PLAY">▶</button>
            <button class="media-btn" data-action="PAUSE">⏸</button>
            <button class="media-btn" data-action="STOP">⏹</button>
            <button class="media-btn" data-action="NEXT">⏭</button>
            <button class="media-btn" data-action="REWIND">⏪</button>
            <button class="media-btn" data-action="FORWARD">⏩</button>
            <button class="media-btn" data-action="RECORD">⏺</button>
            <button class="media-btn" data-action="EJECT">⏏</button>
            <button class="media-btn" data-action="VOL-">🔉</button>
            <button class="media-btn" data-action="VOL+">🔊</button>
            <button class="media-btn" data-action="MUTE">🔇</button>
            <button class="media-btn" data-action="BRIGHTNESS-">🔅</button>
            <button class="media-btn" data-action="BRIGHTNESS+">🔆</button>
        </div>

        <!-- Mouse Control Section -->
        <div class="mouse-section">
            <div class="radar-container">
                <canvas id="radar" width="300" height="300"></canvas>
                <div class="radar-center">+</div>
            </div>
            
            <div class="mouse-controls">
                <div class="button-row">
                    <button class="mouse-btn" data-action="click-left">L</button>
                    <button class="mouse-btn" data-action="click-middle">M</button>
                    <button class="mouse-btn" data-action="click-right">R</button>
                </div>
                <div class="button-row">
                    <button class="mouse-btn hold-btn" data-action="hold-left">HL</button>
                    <button class="mouse-btn hold-btn" data-action="hold-middle">HM</button>
                    <button class="mouse-btn hold-btn" data-action="hold-right">HR</button>
                </div>
                <div class="sensitivity-control">
                    <label for="sensitivity">SENS: <span id="sens-value">5</span>x</label>
                    <input type="range" id="sensitivity" min="1" max="20" value="5">
                </div>
            </div>
        </div>

        <!-- Keyboard Section -->
        <div class="keyboard-section">
            <!-- Function Keys Row -->
            <div class="keyboard-row">
                <button class="key fn-key" data-key="ESC">Esc</button>
                <button class="key fn-key" data-key="F1">F1</button>
                <button class="key fn-key" data-key="F2">F2</button>
                <button class="key fn-key" data-key="F3">F3</button>
                <button class="key fn-key" data-key="F4">F4</button>
                <button class="key fn-key" data-key="F5">F5</button>
                <button class="key fn-key" data-key="F6">F6</button>
                <button class="key fn-key" data-key="F7">F7</button>
                <button class="key fn-key" data-key="F8">F8</button>
                <button class="key fn-key" data-key="F9">F9</button>
                <button class="key fn-key" data-key="F10">F10</button>
                <button class="key fn-key" data-key="F11">F11</button>
                <button class="key fn-key" data-key="F12">F12</button>
            </div>

            <!-- Number Row -->
            <div class="keyboard-row">
                <button class="key" data-key="`">`</button>
                <button class="key" data-key="1">1</button>
                <button class="key" data-key="2">2</button>
                <button class="key" data-key="3">3</button>
                <button class="key" data-key="4">4</button>
                <button class="key" data-key="5">5</button>
                <button class="key" data-key="6">6</button>
                <button class="key" data-key="7">7</button>
                <button class="key" data-key="8">8</button>
                <button class="key" data-key="9">9</button>
                <button class="key" data-key="0">0</button>
                <button class="key" data-key="-">-</button>
                <button class="key" data-key="=">=</button>
                <button class="key wide-key" data-key="BACKSPACE">Backspace</button>
            </div>

            <!-- QWERTY Row -->
            <div class="keyboard-row">
                <button class="key wide-key" data-key="TAB">Tab</button>
                <button class="key" data-key="Q">Q</button>
                <button class="key" data-key="W">W</button>
                <button class="key" data-key="E">E</button>
                <button class="key" data-key="R">R</button>
                <button class="key" data-key="T">T</button>
                <button class="key" data-key="Y">Y</button>
                <button class="key" data-key="U">U</button>
                <button class="key" data-key="I">I</button>
                <button class="key" data-key="O">O</button>
                <button class="key" data-key="P">P</button>
                <button class="key" data-key="[">[</button>
                <button class="key" data-key="]">]</button>
                <button class="key" data-key="\\">\\</button>
            </div>

            <!-- ASDF Row -->
            <div class="keyboard-row">
                <button class="key modifier-key sticky" data-key="CAPSLOCK">Caps</button>
                <button class="key" data-key="A">A</button>
                <button class="key" data-key="S">S</button>
                <button class="key" data-key="D">D</button>
                <button class="key" data-key="F">F</button>
                <button class="key" data-key="G">G</button>
                <button class="key" data-key="H">H</button>
                <button class="key" data-key="J">J</button>
                <button class="key" data-key="K">K</button>
                <button class="key" data-key="L">L</button>
                <button class="key" data-key=";">;</button>
                <button class="key" data-key="'">'</button>
                <button class="key extra-wide-key" data-key="ENTER">Enter</button>
            </div>

            <!-- ZXCV Row -->
            <div class="keyboard-row">
                <button class="key modifier-key sticky extra-wide-key" data-key="SHIFT">Shift</button>
                <button class="key" data-key="Z">Z</button>
                <button class="key" data-key="X">X</button>
                <button class="key" data-key="C">C</button>
                <button class="key" data-key="V">V</button>
                <button class="key" data-key="B">B</button>
                <button class="key" data-key="N">N</button>
                <button class="key" data-key="M">M</button>
                <button class="key" data-key=",">,</button>
                <button class="key" data-key=".">.</button>
                <button class="key" data-key="/">/</button>
                <button class="key extra-wide-key" data-key="SHIFT">Shift</button>
            </div>

            <!-- Bottom Row -->
            <div class="keyboard-row">
                <button class="key modifier-key sticky" data-key="CTRL">Ctrl</button>
                <button class="key modifier-key sticky" data-key="GUI">Win</button>
                <button class="key modifier-key sticky" data-key="ALT">Alt</button>
                <button class="key spacebar" data-key="SPACE">Space</button>
                <button class="key modifier-key sticky" data-key="ALT">Alt</button>
                <button class="key modifier-key sticky" data-key="GUI">Win</button>
                <button class="key modifier-key sticky" data-key="CTRL">Ctrl</button>
            </div>

            <!-- Arrow Keys -->
            <div class="keyboard-row arrow-row">
                <button class="key arrow-key" data-key="UP">↑</button>
                <button class="key arrow-key" data-key="LEFT">←</button>
                <button class="key arrow-key" data-key="DOWN">↓</button>
                <button class="key arrow-key" data-key="RIGHT">→</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
