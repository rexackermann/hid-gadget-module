<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HID Gadget Dark</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Roboto:wght@400;500&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="control-panel">
        <!-- Header & Status -->
        <div class="status-bar">
            <span>HID GADGET <span style="color:var(--accent-color)">PRO</span></span>
            <div>
                <span id="status-dot" class="status-indicator"></span>
                <span id="status-text">Disconnected</span>
            </div>
        </div>

        <!-- Media & System Controls -->
        <h2>System Controls</h2>
        <div class="media-row">
            <button class="key media-btn" data-key="MUTE" title="Mute">🔇</button>
            <button class="key media-btn" data-key="VOL_DOWN" title="Vol -">🔉</button>
            <button class="key media-btn" data-key="VOL_UP" title="Vol +">🔊</button>
            <button class="key media-btn" data-key="PREV" title="Prev">⏮</button>
            <button class="key media-btn" data-key="PLAY" title="Play/Pause">⏯</button>
            <button class="key media-btn" data-key="NEXT" title="Next">⏭</button>
            <button class="key media-btn" data-key="BRI_DOWN" title="Dim">🔅</button>
            <button class="key media-btn" data-key="BRI_UP" title="Bright">🔆</button>
            <button class="key media-btn" data-key="POWER" title="Lock">🔒</button>
        </div>

        <!-- Main Keyboard -->
        <h2>Keyboard</h2>
        <div class="keyboard-container">
            <!-- Function Row -->
            <button class="key function" data-key="ESC">ESC</button>
            <button class="key function" data-key="F1">F1</button>
            <button class="key function" data-key="F2">F2</button>
            <button class="key function" data-key="F3">F3</button>
            <button class="key function" data-key="F4">F4</button>
            <button class="key function" data-key="F5">F5</button>
            <button class="key function" data-key="F6">F6</button>
            <button class="key function" data-key="F7">F7</button>
            <button class="key function" data-key="F8">F8</button>
            <button class="key function" data-key="F9">F9</button>
            <button class="key function" data-key="F10">F10</button>
            <button class="key function" data-key="F11">F11</button>
            <button class="key function" data-key="F12">F12</button>
            <button class="key function" data-key="PRINTSCREEN">PRT</button>
            <button class="key function" data-key="DELETE">DEL</button>

            <!-- Number Row -->
            <button class="key" data-key="GRAVE">`</button>
            <button class="key" data-key="1">1</button>
            <button class="key" data-key="2">2</button>
            <button class="key" data-key="3">3</button>
            <button class="key" data-key="4">4</button>
            <button class="key" data-key="5">5</button>
            <button class="key" data-key="6">6</button>
            <button class="key" data-key="7">7</button>
            <button class="key" data-key="8">8</button>
            <button class="key" data-key="9">9</button>
            <button class="key" data-key="0">0</button>
            <button class="key" data-key="MINUS">-</button>
            <button class="key" data-key="EQUAL">=</button>
            <button class="key key-wide modifier" data-key="BACKSPACE">BACK</button>

            <!-- QWERTY Row -->
            <button class="key key-1-5 modifier" data-key="TAB">TAB</button>
            <button class="key" data-key="Q">Q</button>
            <button class="key" data-key="W">W</button>
            <button class="key" data-key="E">E</button>
            <button class="key" data-key="R">R</button>
            <button class="key" data-key="T">T</button>
            <button class="key" data-key="Y">Y</button>
            <button class="key" data-key="U">U</button>
            <button class="key" data-key="I">I</button>
            <button class="key" data-key="O">O</button>
            <button class="key" data-key="P">P</button>
            <button class="key" data-key="LEFTBRACE">[</button>
            <button class="key" data-key="RIGHTBRACE">]</button>
            <button class="key key-1-5 modifier" data-key="BACKSLASH">\</button>

            <!-- ASDF Row -->
            <button class="key key-1-75 modifier" data-key="CAPSLOCK">CAPS</button>
            <button class="key" data-key="A">A</button>
            <button class="key" data-key="S">S</button>
            <button class="key" data-key="D">D</button>
            <button class="key" data-key="F">F</button>
            <button class="key" data-key="G">G</button>
            <button class="key" data-key="H">H</button>
            <button class="key" data-key="J">J</button>
            <button class="key" data-key="K">K</button>
            <button class="key" data-key="L">L</button>
            <button class="key" data-key="SEMICOLON">;</button>
            <button class="key" data-key="APOSTROPHE">'</button>
            <button class="key key-2 modifier accent" data-key="ENTER">ENTER</button>

            <!-- ZXCV Row -->
            <button class="key key-2-25 modifier" data-key="LEFTSHIFT" id="shift-key">SHIFT</button>
            <button class="key" data-key="Z">Z</button>
            <button class="key" data-key="X">X</button>
            <button class="key" data-key="C">C</button>
            <button class="key" data-key="V">V</button>
            <button class="key" data-key="B">B</button>
            <button class="key" data-key="N">N</button>
            <button class="key" data-key="M">M</button>
            <button class="key" data-key="COMMA">,</button>
            <button class="key" data-key="DOT">.</button>
            <button class="key" data-key="SLASH">/</button>
            <button class="key key-2-25 modifier" data-key="RIGHTSHIFT">SHIFT</button>

            <!-- Bottom Row -->
            <button class="key key-1-5 modifier" data-key="LEFTCTRL">CTRL</button>
            <button class="key modifier" data-key="LEFTMETA">WIN</button>
            <button class="key key-1-5 modifier" data-key="LEFTALT">ALT</button>
            <button class="key key-space" data-key="SPACE"></button>
            <button class="key key-1-5 modifier" data-key="RIGHTALT">ALT</button>
            <button class="key modifier" data-key="RIGHTMETA">FN</button>
            <button class="key key-1-5 modifier" data-key="RIGHTCTRL">CTRL</button>
        </div>

        <!-- Mouse Control -->
        <h2>Trackpad</h2>
        <div class="mouse-area">
            <div class="mouse-buttons">
                <button class="key mouse-btn left" data-mouse="LEFT">L</button>
                <div style="flex:1"></div>
                <button class="key mouse-btn middle" data-mouse="MIDDLE">M</button>
            </div>

            <div id="trackpad" class="trackpad"></div>

            <div class="mouse-buttons">
                <button class="key mouse-btn right" data-mouse="RIGHT">R</button>
            </div>
        </div>

        <!-- Arrow Cluster (Optional, fits under trackpad/next to it in desktop view) -->
        <div style="display:flex; justify-content:flex-end; gap:5px; margin-top:10px;">
            <button class="key" data-key="LEFT">◀</button>
            <div style="display:flex; flex-direction:column; gap:5px">
                <button class="key" data-key="UP">▲</button>
                <button class="key" data-key="DOWN">▼</button>
            </div>
            <button class="key" data-key="RIGHT">▶</button>
        </div>

    </div>

    <script src="app.js"></script>
</body>

</html>
